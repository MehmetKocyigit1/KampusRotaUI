<!doctype html>
<html lang="tr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KampusRota Harita</title>

    <!-- MAPLIBRE GL JS (100% Ücretsiz, Açık Kaynaklı) -->
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
        }

        #map {
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* ÜST KONTROL VE ÜNİVERSİTE SEÇİM ÇUBUĞU */
        .top-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(16, 42, 67, 0.15);
            border: 1px solid rgba(189, 221, 237, 0.8);
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 540px;
            margin: 0 auto;
        }

        .top-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .uni-select {
            flex: 1;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #BDDDED;
            background-color: #F3FBFF;
            color: #102A43;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .uni-select:focus {
            border-color: #1D9DE5;
        }

        .filter-pills {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 2px;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .filter-pills::-webkit-scrollbar {
            display: none;
        }

        .pill {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            background: #EAF6FD;
            color: #174A72;
            border: 1px solid #BDDDED;
            transition: all 0.15s ease;
        }

        .pill.active {
            background: #1D9DE5;
            color: #fff;
            border-color: #1D9DE5;
        }

        /* PİN VE ETİKET TASARIMLARI */
        .pin-wrapper {
            cursor: pointer;
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.3));
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .pin-wrapper:hover,
        .pin-wrapper:active {
            transform: scale(1.18) translateY(-4px);
        }

        .pin-icon {
            width: 30px;
            height: 38px;
            display: block;
        }

        .place-tag {
            background: white;
            color: #102A43;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(0, 0, 0, 0.08);
            white-space: nowrap;
            cursor: pointer;
            pointer-events: auto;
            margin-top: -6px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: transform 0.15s ease;
        }

        .place-tag:hover {
            transform: scale(1.08);
        }

        .category-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }

        /* ALT SEÇİM BİLGİ KARTI (BOTTOM SHEET) */
        .selection-sheet {
            position: absolute;
            bottom: 20px;
            left: 16px;
            right: 16px;
            max-width: 480px;
            margin: 0 auto;
            z-index: 20;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(16, 42, 67, 0.22);
            border: 1px solid #BDDDED;
            padding: 16px;
            transform: translateY(140%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .selection-sheet.visible {
            transform: translateY(0);
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .sheet-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sheet-close {
            background: #EAF6FD;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #486581;
            cursor: pointer;
            line-height: 1;
        }

        .sheet-title {
            font-size: 17px;
            font-weight: 700;
            color: #102A43;
            margin: 0 0 4px 0;
        }

        .sheet-desc {
            font-size: 12px;
            color: #627D98;
            margin: 0 0 14px 0;
            line-height: 1.4;
        }

        .sheet-select-btn {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            background: #1D9DE5;
            color: white;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(29, 157, 229, 0.35);
            transition: background 0.15s ease, transform 0.1s ease;
        }

        .sheet-select-btn:active {
            transform: scale(0.98);
            background: #1580BA;
        }
    </style>
</head>

    <div class="top-bar">
        <div class="top-row">
            <select id="universitySelect" class="uni-select" onchange="onUniversityDropdownChanged(this.value)">
                <!-- Dinamik Doldurulur -->
            </select>
        </div>
        <div class="filter-pills">
            <div class="pill active" onclick="filterCategory('all', this)">🌟 Tümü</div>
            <div class="pill" onclick="filterCategory('Kampus', this)">🎓 Kampüs</div>
            <div class="pill" onclick="filterCategory('Yurt', this)">🏠 Yurtlar</div>
            <div class="pill" onclick="filterCategory('Ulasim', this)">🚌 Ulaşım</div>
            <div class="pill" onclick="filterCategory('Sosyal', this)">☕ Sosyal / AVM</div>
        </div>
    </div>

    <!-- ALT SEÇİM BİLGİ KARTI -->
    <div id="selectionSheet" class="selection-sheet">
        <div class="sheet-header">
            <span id="sheetCategoryBadge" class="sheet-badge" style="background-color: #007AFF;">Kampüs</span>

        <h3 id="sheetTitle" class="sheet-title">Durak Başlığı</h3>

        // ==========================================
        // 2. HARİTA OLUŞTURMA & ESRI ALT TABANI
        // ==========================================
        window.mapReady = false;
        let currentMarkers = [];
        let currentSelectedPlace = null;
        let activeCategoryFilter = 'all';
        let currentLoadedPlaces = [];

        const map = new maplibregl.Map({
            container: "map",
            style: {
                version: 8,
                sources: {
                    'esri-tiles': {
                        type: 'raster',
                        tiles: [
                            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}'
                        ],
                        tileSize: 256,
                        attribution: '© Esri, HERE, Garmin, OpenStreetMap'
                    }
                },
                layers: [
                    { id: 'esri-tiles', type: 'raster', source: 'esri-tiles' }
                ]
            },
            center: [30.5345, 37.8285], // Varsayılan: Isparta SDÜ
            zoom: 14,
            minZoom: 5,
            maxZoom: 18,
            renderWorldCopies: false
        });

        map.addControl(new maplibregl.NavigationControl(), "top-right");

        // Kategori Renkleri
        const categoryMeta = {
            'Kampus': { color: '#007AFF', label: 'Kampüs' },
            'Yurt': { color: '#34C759', label: 'KYK / Yurt' },
            'Ulasim': { color: '#FF9500', label: 'Ulaşım' },
            'Sosyal': { color: '#AF52DE', label: 'Sosyal / AVM' },
            'Diger': { color: '#8E8E93', label: 'Diğer' }
        };

        function getCategoryMeta(cat) {
            return categoryMeta[cat] || { color: '#1D9DE5', label: cat || 'Nokta' };
        }

        // SVG Pin İkonu Üretici
        function createPinSvg(color) {
            return `
                <svg class="pin-icon" viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 0C7 0 3.5 3.6 3.5 8.1c0 5.9 7.8 15.8 7.9 15.9.2-.1 7.9-10 7.9-15.9C20.5 3.6 17 0 12 0z" fill="${color}" stroke="#ffffff" stroke-width="1.6"/>
                    <circle cx="12" cy="8.1" r="3.6" fill="#ffffff"/>
                </svg>`;
        }

        // Pin ve Etiketleri Haritaya Basma
        function renderMarkers(places) {
            currentMarkers.forEach(m => m.remove());
            currentMarkers = [];

            if (!places || !Array.isArray(places)) return;

            places.forEach(place => {
                if (activeCategoryFilter !== 'all' && place.category !== activeCategoryFilter) {
                    return;
                }

                const lat = place.latitude !== undefined ? place.latitude : (place.coords ? place.coords[1] : null);
                const lng = place.longitude !== undefined ? place.longitude : (place.coords ? place.coords[0] : null);
                if (lat == null || lng == null) return;

                const coords = [parseFloat(lng), parseFloat(lat)];
                const meta = getCategoryMeta(place.category);

                // 1. SVG Pin İkonu
                const pinWrap = document.createElement('div');
                pinWrap.className = 'pin-wrapper';
                pinWrap.innerHTML = createPinSvg(meta.color);
                pinWrap.onclick = function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    sendLocationSelection(place);
                };

                // 2. Metin Etiketi (Pin Altında Görünür)
                const tagEl = document.createElement('div');
                tagEl.className = 'place-tag';
                tagEl.innerHTML = `<span class="category-dot" style="background-color:${meta.color}"></span>${place.title || place.location}`;
                tagEl.onclick = function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    sendLocationSelection(place);
                };

                const pinMarker = new maplibregl.Marker(pinWrap, { offset: [0, -16] })
                    .setLngLat(coords)
                    .addTo(map);

                const tagMarker = new maplibregl.Marker(tagEl, { offset: [0, -44] })
                    .setLngLat(coords)
                    .addTo(map);

                currentMarkers.push(pinMarker, tagMarker);
            });
        }

        // ==========================================
        // 3. SEÇİM MEKANİZMASI & C# İLETİŞİMİ
        // ==========================================
        function sendLocationSelection(place) {
            const locName = place.title || place.location || place.name || '';
            const lat = place.latitude !== undefined ? parseFloat(place.latitude) : (place.coords ? parseFloat(place.coords[1]) : 0);
            const lng = place.longitude !== undefined ? parseFloat(place.longitude) : (place.coords ? parseFloat(place.coords[0]) : 0);
            const key = place.locationKey || place.key || '';

            const message = {
                type: 'locationSelected',
                locationKey: key,
                location: locName,
                latitude: lat,
                longitude: lng
            };

            const jsonStr = JSON.stringify(message);
            const encoded = encodeURIComponent(jsonStr);

            // 1. C# MAUI Windows WebView2 PostMessage
            try {
                if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
                    window.chrome.webview.postMessage(message);
                }
            } catch (e) { }

            // 2. Local HTTPS Navigation (Intercepted reliably by MapWebView.Navigating on Windows & Mobile)
            try {
                window.location.href = 'https://kampusrota.local/locationSelected?data=' + encoded;
            } catch (e) { }

            // 3. App URL Scheme Fallback
            try {
                window.location.href = 'app://locationSelected?data=' + encoded;
            } catch (e) { }
        }

        // ==========================================
        // 4. ÜNİVERSİTE DEĞİŞTİRME & ODAKLANMA
        // ==========================================
        function populateDropdown(universities) {
            const select = document.getElementById('universitySelect');
            select.innerHTML = '';
            universities.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u.id || u.key;
                opt.textContent = `${u.city} · ${u.name}`;
                select.appendChild(opt);
            });
        }

        function onUniversityDropdownChanged(val) {
            const target = CAMPUS_CATALOG.find(u => String(u.id) === String(val) || u.key === val);
            if (target) {
                focusAndLoadUniversity(target);
            }
        }

        function focusAndLoadUniversity(uni) {
            closeSheet();
            const select = document.getElementById('universitySelect');
            if (select) select.value = uni.id || uni.key;

            map.flyTo({
                center: [uni.lng, uni.lat],
                zoom: uni.zoom || 14,
                speed: 1.4,
                essential: true
            });

            currentLoadedPlaces = uni.places || [];
            renderMarkers(currentLoadedPlaces);
        }

        function filterCategory(cat, btn) {
            activeCategoryFilter = cat;
            document.querySelectorAll('.filter-pills .pill').forEach(p => p.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderMarkers(currentLoadedPlaces);
        }

        // ==========================================
        // 5. DIŞARIDAN (C# MAUI) ÇAĞRILABİLEN FONKSİYONLAR
        // ==========================================
        let currentUniId = null;

        // ID veya İsme Göre Üniversiteye Odaklan
        window.selectUniversityById = function (id) {
            currentUniId = id;
            if (!window.mapReady) {
                return true; // Harita yüklenince otomatik açılacak
            }
            const uni = CAMPUS_CATALOG.find(u => String(u.id) === String(id));
            if (uni) {
                focusAndLoadUniversity(uni);
                return true;
            }
            return false;
        };

        window.focusUniversity = function (lat, lng, zoom) {
            try {
                lat = parseFloat(lat);
                lng = parseFloat(lng);
                zoom = zoom ? parseInt(zoom) : 14;
                map.flyTo({ center: [lng, lat], zoom: zoom, speed: 1.2, essential: true });
            } catch (e) { }
        };

        // Backend API'den gelen dinamik durakları haritaya bas
        window.loadCampusPlaces = function (places) {
            try {
                while (typeof places === 'string') {
                    places = JSON.parse(places);
                }
                if (places && Array.isArray(places) && places.length > 0) {
                    currentLoadedPlaces = places;
                    renderMarkers(currentLoadedPlaces);
                }
            } catch (e) { }
        };

        // ==========================================
        // 6. HARİTA BAŞLATMA
        // ==========================================
        map.on('load', function () {
            window.mapReady = true;
            populateDropdown(CAMPUS_CATALOG);

            if (currentUniId) {
                window.selectUniversityById(currentUniId);
            } else {
                focusAndLoadUniversity(CAMPUS_CATALOG[0]);
            }
            console.log('KampusRota MapLibre Multi-Campus Map Ready with 18 Universities');
        });
    </script>
</body>

</html>
