    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #EAF6FD;
        }

        #map {
            width: 100vw;
            height: 100vh;
        }

        /* BİRLEŞİK PİN VE ETİKET TASARIMI */
        .campus-marker {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            user-select: none;
            pointer-events: auto;
            transition: transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .campus-marker:hover,
        .campus-marker:active,
        .campus-marker:focus {
            transform: scale(1.15) translateY(-4px);
            z-index: 9999 !important;
            outline: none;
        }

        .marker-tag {
            background: #ffffff;
            color: #102A43;
            padding: 4px 9px;
            border-radius: 9px;
            font-size: 11px;
            font-weight: 700;
            box-shadow: 0 3px 10px rgba(16, 42, 67, 0.28);
            border: 1px solid rgba(189, 221, 237, 0.9);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 2px;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cat-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .tag-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .marker-pin {
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
        }

        .pin-svg {
            width: 26px;
            height: 34px;
            display: block;
        }

        /* KULLANICI MEVCUT KONUM NOKTASI */
        .user-marker {
            position: relative;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #007AFF;
            border: 3px solid white;
            box-shadow: 0 0 12px rgba(0, 122, 255, 0.8);
        }

        .user-marker::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 122, 255, 0.2);
            animation: pulse 1.6s infinite;
            z-index: -1;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0.9; }
            70% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
        }

        /* ALT KATEGORİ FİLTRELEME ÇUBUĞU */
        .filter-bar {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(16, 42, 67, 0.18);
            border: 1px solid rgba(189, 221, 237, 0.9);
            padding: 6px 8px;
            display: flex;
            gap: 6px;
            max-width: 95vw;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .filter-bar::-webkit-scrollbar {
            display: none;
        }

        .pill {
            padding: 5px 12px;
            border-radius: 18px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            background: #EAF6FD;
            color: #174A72;
            border: 1px solid #BDDDED;
            transition: all 0.15s ease;
            user-select: none;
        }

        .pill.active {
            background: #1D9DE5;
            color: #ffffff;
            border-color: #1D9DE5;
            box-shadow: 0 2px 8px rgba(29, 157, 229, 0.35);
        }

        .pill:active {
            transform: scale(0.95);
        }
    </style>
</head>

        const CATEGORY_COLORS = {
            'Kampus': '#1D9DE5',
            'Yurt': '#10B981',
            'Ulasim': '#8B5CF6',
            'Sosyal': '#F59E0B',
            'Diger': '#6B7280'
        };

        function getCategoryColor(category) {
            return CATEGORY_COLORS[category] || '#FF6A00';
        }

        // ==========================================
        // 2. HARİTA OLUŞTURMA (ESRI WORLD STREET MAP)
        // ==========================================
        const defaultCenter = [30.5345, 37.8285]; // SDÜ Isparta varsayılan
        const map = new maplibregl.Map({
            container: "map",
            style: {
                version: 8,
                sources: {
                    'esri-tiles': {
                        type: 'raster',
                        tiles: [
                            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}'
                        ],
                        tileSize: 256,
                        attribution: '© Esri — Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom'
                    }
                },
                layers: [
                    { id: 'esri-tiles', type: 'raster', source: 'esri-tiles' }
                ]
            },
            center: defaultCenter,
            zoom: 14,
            minZoom: 4,
            maxZoom: 18,
            renderWorldCopies: false
        });

        map.addControl(new maplibregl.NavigationControl(), "top-right");

        let currentMarkers = [];
        let currentLoadedPlaces = [];
        let activeCategoryFilter = 'all';

        // ==========================================
        // 3. PİN VE ETİKETLERİ HARİTAYA ÇİZME
        // ==========================================
        function renderMarkers(places) {
            currentMarkers.forEach(function(m) { m.remove(); });
            currentMarkers = [];

            if (!places || !Array.isArray(places)) return;

            places.forEach(function(place) {
                const category = place.category || place.Category || 'Kampus';
                if (activeCategoryFilter !== 'all' && category !== activeCategoryFilter) {
                    return;
                }

                const lat = place.latitude !== undefined ? place.latitude : 
                            (place.Latitude !== undefined ? place.Latitude : 
                            (place.coords ? place.coords[1] : null));
                const lng = place.longitude !== undefined ? place.longitude : 
                            (place.Longitude !== undefined ? place.Longitude : 
                            (place.coords ? place.coords[0] : null));

                if (lat == null || lng == null) return;

                const coords = [parseFloat(lng), parseFloat(lat)];
                const title = place.title || place.Title || place.location || place.Location || place.name || place.Name || 'Nokta';
                const color = getCategoryColor(category);

                // Tek bir birleşik Marker DOM kapsayıcısı
                const markerContainer = document.createElement('div');
                markerContainer.className = 'campus-marker';
                markerContainer.setAttribute('role', 'button');
                markerContainer.setAttribute('tabindex', '0');
                markerContainer.setAttribute('aria-label', title + ' seç');

                markerContainer.innerHTML = 
                    '<div class="marker-tag">' +
                        '<span class="cat-dot" style="background-color: ' + color + ';"></span>' +
                        '<span class="tag-title">' + title + '</span>' +
                    '</div>' +
                    '<div class="marker-pin">' +
                        '<svg class="pin-svg" viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg">' +
                            '<path d="M12 0C7 0 3.5 3.6 3.5 8.1c0 5.9 7.8 15.8 7.9 15.9.2-.1 7.9-10 7.9-15.9C20.5 3.6 17 0 12 0z" fill="' + color + '" stroke="#ffffff" stroke-width="1.6"/>' +
                            '<circle cx="12" cy="8.1" r="3.2" fill="#ffffff"/>' +
                        '</svg>' +
                    '</div>';

                function onSelect(e) {
                    if (e) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                    sendLocationSelection(place);
                }

                markerContainer.addEventListener('click', onSelect);
                markerContainer.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        onSelect(e);
                    }
                });

                // MapLibre Marker: anchor: 'bottom' ile tam pin ucundan konuma kenetlenir
                const marker = new maplibregl.Marker({
                    element: markerContainer,
                    anchor: 'bottom'
                })
                    .setLngLat(coords)
                    .addTo(map);

                currentMarkers.push(marker);
            });
        }

        // ==========================================
        // 4. KONUM SEÇİMİ VE C# İLETİŞİMİ
        // ==========================================
        function sendLocationSelection(place) {
            const title = place.title || place.Title || place.location || place.Location || place.name || place.Name || '';
            const key = place.locationKey || place.LocationKey || place.key || place.Key || '';
            const lat = place.latitude !== undefined ? parseFloat(place.latitude) : 
                        (place.Latitude !== undefined ? parseFloat(place.Latitude) : 
                        (place.coords ? parseFloat(place.coords[1]) : 0));
            const lng = place.longitude !== undefined ? parseFloat(place.longitude) : 
                        (place.Longitude !== undefined ? parseFloat(place.Longitude) : 
                        (place.coords ? parseFloat(place.coords[0]) : 0));

            const payload = {
                type: 'locationSelected',
                locationKey: key,
                location: title,
                latitude: lat,
                longitude: lng
            };

            const jsonStr = JSON.stringify(payload);
            const encoded = encodeURIComponent(jsonStr);

            // 1. Windows WebView2 postMessage
            try {
                if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
                    window.chrome.webview.postMessage(jsonStr);
                }
            } catch (e) { }

            // 2. URL Navigation (Windows / Android / iOS MAUI Navigating Intercept)
            try {
                window.location.href = 'https://kampusrota.local/locationSelected?data=' + encoded;
            } catch (e) { }
        }

        // ==========================================
        // 5. ÜNİVERSİTE DEĞİŞTİRME & ODAKLANMA
        // ==========================================
        function focusAndLoadUniversity(uni) {
            if (!uni) return;

            map.flyTo({
                center: [uni.lng, uni.lat],
                zoom: uni.zoom || 14,
                speed: 1.5,
                essential: true
            });

            currentLoadedPlaces = uni.places || [];
            renderMarkers(currentLoadedPlaces);
        }

        function filterCategory(cat, btn) {
            activeCategoryFilter = cat;
            document.querySelectorAll('.filter-bar .pill').forEach(function(p) { p.classList.remove('active'); });
            if (btn) btn.classList.add('active');
            renderMarkers(currentLoadedPlaces);
        }

        // ==========================================
        // 6. DIŞARIDAN (C# MAUI) ÇAĞRILAN METOTLAR
        // ==========================================
        let currentUniId = null;

        window.selectUniversityById = function (id) {
            currentUniId = id;
            if (!window.mapReady) {
                return true;
            }
            const uni = CAMPUS_CATALOG.find(function(u) { return String(u.id) === String(id); });
            if (uni) {
                focusAndLoadUniversity(uni);
                return true;
            }
            return false;
        };

        window.focusUniversity = function (lat, lng, zoom) {
            try {
                lat = parseFloat(lat);
                lng = parseFloat(lng);
                zoom = zoom ? parseInt(zoom) : 14;
                map.flyTo({ center: [lng, lat], zoom: zoom, speed: 1.3, essential: true });
            } catch (e) { }
        };

        window.loadCampusPlaces = function (places) {
            try {
                while (typeof places === 'string') {
                    places = JSON.parse(places);
                }
                if (places && Array.isArray(places) && places.length > 0) {
                    currentLoadedPlaces = places;
                    renderMarkers(currentLoadedPlaces);
                }
            } catch (e) { }
        };

        // ==========================================
        // 7. HARİTA BAŞLATMA
        // ==========================================
        map.on('load', function () {
            window.mapReady = true;

            if (currentUniId) {
                window.selectUniversityById(currentUniId);
            } else {
                window.selectUniversityById(1);
            }
            console.log('KampusRota MapLibre 18 Universities Ready');
        });
    </script>
